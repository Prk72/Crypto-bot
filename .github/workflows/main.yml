name: Crypto Bot

on:
  schedule:
    - cron: "0 */3 * * *"      # har 3 ghante (UTC 00,03,06,...)
  workflow_dispatch:
    inputs:
      mode:
        description: "Konsa content? (auto = time slot ke hisaab se)"
        type: choice
        default: auto
        options: [auto, news, market, funded, airdrop, referral]
      test:
        description: "Sirf Telegram test message bhejo"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: crypto-bot
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages (ffmpeg, fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-montserrat

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINK_HUB_URL: ${{ secrets.LINK_HUB_URL }}
          PEXAFY_API_KEY: ${{ secrets.PEXAFY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          FORCE_MODE: ${{ inputs.mode }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python main.py --test
          else
            python main.py
          fi

      - name: Save state (repeat news / offers se bachne ke liye)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if git diff --cached --quiet; then
            echo "state unchanged"
          else
            git commit -m "chore: update state [skip ci]" && git pull --rebase -q && git push || echo "state push fail (zaroori nahi)"
          fi

      - name: Save video as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
