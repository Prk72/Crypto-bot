name: Crypto Bot

on:
  schedule:
    - cron: "30 2 * * *"       # roz subah 8:00 AM IST (UTC 02:30) - time badal sakte ho
  workflow_dispatch:
    inputs:
      test:
        description: "Sirf Telegram test message bhejo"
        type: boolean
        default: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system packages (ffmpeg, fonts)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINK_HUB_URL: ${{ secrets.LINK_HUB_URL }}
        run: |
          if [ "${{ inputs.test }}" = "true" ]; then
            python main.py --test
          else
            python main.py
          fi

      - name: Save video as artifact (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-video
          path: output/*.mp4
          if-no-files-found: ignore
          retention-days: 7
          
